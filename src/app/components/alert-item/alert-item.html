<div class="alerts-item">
  @if (alert.type === 'storm') {

  <mat-icon [style.color]="getSeverityColor()">{{ getStormIcon() }}</mat-icon>

  }@else {
  <mat-icon [style.color]="getSeverityColor()">{{ iconMap[alert.type] }}</mat-icon>

  }

  <div class="text-item">
    <p>{{ getSpecificSeverity() + ' ' + alert.type }}</p>
    <p>{{ alert.location }}</p>
    <p>{{ alert.time | timeAgo }}</p>
  </div>
</div>
